logging.level.com.zaxxer.hikari=INFO

http {
    bind-host = localhost
    bind-host = ${?HTTP_HOST}

    bind-port = 8000
    bind-port = ${?HTTP_PORT}

    base-uri = ${?BASE_URI}

    validate-redirects = true
    validate-redirects = ${?VALIDATE_REDIRECTS}
}

auth {
    bcrypt {
        rounds = 10
        rounds = ${?BCRYPT_ROUNDS}
        pepper = ${?BCRYPT_PEPPER}
    }

    dcc-login {
        login-time-limit-seconds = 30
        login-time-limit-seconds = ${?DCC_LOGIN_TIME_LIMIT}
    }

    portal-dcc {
        base-url = ${PORTAL_DCC_BASE_URL}
        app-id = ${PORTAL_DCC_APP_ID}

        jwt {
            secret-key = ${PORTAL_DCC_SECRET_KEY}

            access-token-life-seconds = 30
            refresh-token-life-seconds = 0
            leeway-seconds = 0
        }
    }

    jwt {
        secret-key = ${SECRET_KEY}

        access-token-life-seconds = 999999999
        refresh-token-life-seconds = 999999999
        leeway-seconds = 10
    }
}

db {
    host = ${DB_HOST}

    port = 5432
    port = ${?DB_PORT}

    credentials {
        username = ${DB_USER}
        password = ${DB_PASS}

        database = ramitos
        database = ${?DB_NAME}
    }

    hikari {
        maximum-pool-size = ${?HIKARI_POOL_SIZE}
        minimum-idle-millis = ${?HIKARI_MIN_IDLE}
        max-lifetime-millis = ${?HIKARI_MAX_LIFETIME}
        idle-timeout-millis = ${?HIKARI_IDLE_TIMEOUT}
    }
}

mufasa {
    base-url = ${MUFASA_BASE_URL}
    token   = ${MUFASA_TOKEN}
}

cfg {
    logging.level.com.zaxxer.hikari=INFO
}

